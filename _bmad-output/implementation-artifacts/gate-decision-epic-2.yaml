known_gaps:
  - id: "R2-E2E-fixme"
    description: >
      2 test.fixme() scenarios in e2e/tests/clientes/delete-client.spec.ts
      (lines 126, 157) covering the contact-orphaning E2E UI journey, blocked
      on Epic 3 /api/v1/contactos endpoints not yet existing.
    severity: MEDIUM (non-blocking)
    compensating_control: >
      ClienteRepositoryTests.DeleteAsync_WithClienteThatHasAssociatedContacts_OrphansTheContactsInsteadOfCascadeDeletingThem
      (real PostgreSQL, backend integration test) deterministically verifies
      FK ON DELETE SET NULL behavior. ClienteDetailView.test.tsx covers the
      orphaning-toast copy at component level.
    remediation: "Un-skip both test.fixme() blocks once Epic 3 ships Contacto CRUD/seeding endpoints."
    blocks_gate: false
  - id: "TC-E2-P3-02"
    description: "Concurrent edit last-write-wins behavior — intentionally manual/exploratory, not automated."
    severity: LOW
    blocks_gate: false

rationale: >
  All P0 acceptance criteria (AC-E2.1 through AC-E2.5) have FULL coverage,
  including the epic's highest-risk item (R2, contact orphaning on client
  delete), verified deterministically against real PostgreSQL rather than an
  in-memory provider. All P1 criteria at 100% coverage. All 6 stories are
  Status: done with test-review verdicts of Excellent/Approve and zero
  unresolved BLOCKER issues. The only known gap (2 fixme E2E scenarios) is
  explicitly documented, non-blocking, and has a stronger compensating
  control already in place at the API-integration level.

residual_risk: LOW

