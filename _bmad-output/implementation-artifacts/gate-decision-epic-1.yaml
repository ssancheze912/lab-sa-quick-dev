# ─── GAPS ─────────────────────────────────────────────────────────
gaps:
  critical: 0
  high: 1
  medium: 1
  low: 0
  detail:
    - id: GAP-1
      priority: P1
      severity: high
      test_case: TC-E1-P1-05
      title: "Postgres integration test skipped (Docker daemon unavailable in sandbox)"
      description: >
        EfCoreMigrationTests uses Testcontainers.PostgreSql via SkippableFact.
        Docker daemon is not present in this environment; tests self-skip.
        Manual `dotnet ef database update` was also not executed (no PostgreSQL 18).
      mitigation:
        - "AppDbContextConventionTests proves snake_case metadata (in-memory)"
        - "MigrationScopeGuardTests proves empty Up()/Down() bodies"
        - "SnakeCaseNamingConventionEdgeCaseTests proves algorithm (12+ tests)"
      action:
        - "Enable Docker in CI runner (GitHub Actions ubuntu-latest supports it natively)"
        - "Alternative: provision a service-container Postgres in CI"
        - "Optional: add SQLite-based migration-apply fallback test for sandbox envs"
    - id: GAP-2
      priority: multiple
      severity: medium
      test_case: e2e_playwright_suite
      title: "Playwright E2E specs authored but not executed in sandbox"
      description: >
        `pnpm exec playwright install chromium` returns 403 through sandbox
        proxy. All 6 Playwright spec files are authored and syntactically
        valid but never ran in the sandbox for stories 1.1 or 1.2.
      mitigation:
        - "Vitest suite covers TC-E1-P1-01, TC-E1-P1-04, TC-E1-P2-01/02/03 at component level"
        - "xUnit integration tests cover TC-E1-P0-03/04/05 in-process via WebApplicationFactory"
        - "Assertions are duplicated at Vitest/xUnit level where possible"
      action:
        - "In CI, run `pnpm exec playwright install --with-deps chromium` (one-liner)"
        - "Once green, treat Playwright pass-rate as source-of-truth for E2E assertions"

