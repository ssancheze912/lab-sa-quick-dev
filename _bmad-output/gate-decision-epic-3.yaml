      p0_pass_rate: "100%"
      p1_coverage: "89%"
      p1_pass_rate: "100% (of implemented tests)"
      overall_pass_rate: "100% (of implemented tests)"
      overall_coverage: "89%"
      security_issues: 0
      critical_nfrs_fail: 0
      flaky_tests: 0
