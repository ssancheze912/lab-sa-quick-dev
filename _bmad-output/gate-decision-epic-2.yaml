          - "2.6-AC2: Nombre Z→A sort"
          - "2.6-AC3: Más reciente sort"
          - "2.6-AC4: Más antiguo sort"
          - "2.6-AC5: Sort with active search filter"
          - "2.6-AC6: Default sort order"
        mitigation: "Add data-testid='sort-control' to <select> in SortControl component; re-run tests"
        estimated_effort: "1 hour"
        risk_level: "LOW"
      - id: "C-002"
        priority: "P2"
        description: "NFR1 performance test (search <1s with 500 records) not formally implemented"
        affected_criteria:
          - "2.1-AC2: Search <1s with 500 records"
        mitigation: "Manual smoke test during staging validation; automated test in next sprint"
        estimated_effort: "2 hours"
        risk_level: "LOW"

