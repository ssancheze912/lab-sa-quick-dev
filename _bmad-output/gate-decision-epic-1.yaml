        - "e2e/tests/foundation/project-initialization-edge-cases.spec.ts"
        - "e2e/tests/api/backend-initialization.api.spec.ts"
        - "e2e/tests/api/backend-initialization-edge-cases.api.spec.ts"
        - "e2e/tests/navigation/navigation-shell.spec.ts"
        - "e2e/tests/navigation/navigation-shell-edge-cases.spec.ts"
      backend_tests:
        - "backend/tests/SiesaAgents.UnitTests/Infrastructure/ExceptionHandlingMiddlewareTests.cs"
        - "backend/tests/SiesaAgents.UnitTests/Infrastructure/AppDbContextTests.cs"
      frontend_tests:
        - "frontend/src/routes/-__root.test.tsx (6 component tests)"

    # Remediation backlog
    remediation:
      - story: "Add dotnet build SiesaAgents.slnx CI gate step"
        priority: "P1"
        target_sprint: "Epic 2"
        closes: "TC-E1-P1-06"
      - story: "Add TestContainers for AppDbContextTests DB isolation"
        priority: "P2"
        target_sprint: "Epic 2"
      - story: "Fix NavigationRail active state (activeItemId)"
        priority: "P2"
        target_sprint: "Epic 2"
        reference: "MED-01 from code review story 1.2"
      - story: "Redesign TC-E1-P2-02 Vitest viewport test for genuine media query verification"
        priority: "P2"
        target_sprint: "Epic 2"
        reference: "MED-02 from code review story 1.2"

    next_steps: >
      Proceed to Epic 2 development. Epic 1 foundation is functionally
      complete. All critical paths (CORS, Problem Details, TypeScript build,
      SPA navigation, deep linking, database foundation) are fully validated.
      Create remediation story for dotnet build CI gate before Epic 2 closes.
